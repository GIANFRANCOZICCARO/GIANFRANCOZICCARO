name: File classifier tests
on:
  push:
    paths: ['file-classifier/**', '.github/workflows/file-classifier-tests.yml']
  pull_request:
    paths: ['file-classifier/**', '.github/workflows/file-classifier-tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ./file-classifier pytest
      - run: python -m pytest -q file-classifier/tests
