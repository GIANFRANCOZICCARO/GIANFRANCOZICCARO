[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-classifier"
version = "0.1.0"
description = "Indicizza, classifica per argomento e riorganizza i file di un disco; database SQLite interrogabile."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.8.0",
    "numpy>=1.24",
    "pypdf>=3.0",
    "python-docx>=1.0",
    "psutil>=5.9",
]

# Opzionali: analisi del contenuto delle immagini (OCR + riconoscimento
# visivo del soggetto). Pesanti (centinaia di MB, modelli scaricati al
# primo uso) e non necessari per il funzionamento di base: si installano
# solo con 'pip install -e ".[immagini]"'.
[project.optional-dependencies]
immagini = [
    "pillow>=10.0",
    "easyocr>=1.7",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.scripts]
file-classifier = "file_classifier.cli:main"

[tool.setuptools.packages.find]
include = ["file_classifier*"]
