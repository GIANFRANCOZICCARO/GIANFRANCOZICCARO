[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-classifier"
version = "0.1.0"
description = "Indicizza, classifica per argomento e riorganizza i file di un disco; database SQLite interrogabile."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.8.0",
    "numpy>=1.24",
    "pypdf>=3.0",
    "python-docx>=1.0",
    "psutil>=5.9",
]

[project.scripts]
file-classifier = "file_classifier.cli:main"

[tool.setuptools.packages.find]
include = ["file_classifier*"]
